<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: dark; --bg: #151412; --rail: #1A1816; --panel: #1E1C19; --line: #2C2925; --fg: #F3EFE7; --muted: #A39E93;
  --clay: #D97757; --teal: #5FB3A1; --amber: #E0A458; --gray: #4A453D; --serif: 'Instrument Serif', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
a { color: var(--fg); text-decoration: none; } a:hover { color: var(--clay); }
.app { display: flex; min-height: 100vh; }
.rail { width: 220px; flex-shrink: 0; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); background: var(--rail); position: sticky; top: 0; height: 100vh; }
.brand { font: 26px var(--serif); padding: 4px 12px 20px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--muted); }
.rail a[aria-current] { background: var(--line); color: var(--fg); font-weight: 500; }
.rail svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; }
.grow { flex-grow: 1; }
main { flex-grow: 1; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font: 400 34px var(--serif); } h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel { padding: 20px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.inset { padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.warnbox { background: #2A2320; border-color: #4A3A2E; flex-direction: row; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; } .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 4px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.kpi { padding: 18px 20px; gap: 6px; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.big { font: 30px var(--mono); }
.muted { color: var(--muted); } .small { font-size: 12px; } .note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.mono { font-family: var(--mono); } .teal { color: var(--teal); } .clay { color: var(--clay); } .amber { color: var(--amber); }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: #23342F; color: var(--teal); } .chip.warn { background: #3A2E24; color: var(--amber); } .chip.bad { background: #3A2420; color: var(--clay); }
button, select, input, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
button { cursor: pointer; font-weight: 500; } button:hover:not(:disabled) { border-color: var(--muted); } button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--clay); border-color: var(--clay); color: var(--bg); font-weight: 600; }
button.sm, select.sm { padding: 6px 10px; border-radius: 6px; }
input[type=number] { width: 72px; font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.seg button { border: none; background: transparent; color: var(--muted); padding: 7px 12px; }
.seg button[aria-pressed=true] { background: var(--line); color: var(--fg); }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; display: flex; flex-grow: 1; }
.bar > div { height: 100%; }
.table { display: flex; flex-direction: column; gap: 2px; overflow-x: auto; }
.tr { display: grid; gap: 12px; padding: 10px; border-radius: 8px; align-items: center; font: 13px var(--mono); min-width: 760px; }
.tr:nth-child(even) { background: var(--bg); } .tr.th { color: var(--muted); font: 12px var(--sans); }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live .tr { grid-template-columns: 70px 76px 1fr 56px 64px; gap: 8px; padding: 8px; font-size: 12px; min-width: 420px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); display: inline-block; flex-shrink: 0; }
.status { padding: 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.dashed { background: var(--rail); border-style: dashed; border-color: var(--gray); }
pre, .cmd { font: 12px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.err { color: var(--clay); }
.plain { border: 0; background: none; padding: 0; font: inherit; text-align: left; max-width: 100%; } .plain:hover { color: var(--clay); }
.meter .bar { height: 4px; }
.brain { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.md { overflow-wrap: anywhere; } .md h1 { font-size: 26px; margin: 0 0 6px; } .md h2 { margin: 14px 0 4px; } .md h3, .md h4 { margin: 10px 0 2px; font-size: 14px; }
.md p, .md ul, .md ol { margin: 4px 0; } .md ul, .md ol { padding-left: 20px; } .md a { color: var(--teal); } .md td { border: 1px solid var(--line); padding: 4px 8px; }
.md code { font: 12px var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 4px; } .md table { border-collapse: collapse; margin: 6px 0; }
.funnel { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; } .funnel .arrow { align-self: center; color: var(--gray); font-size: 18px; }
.stage { flex: 1 1 130px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 10px; text-align: left; font-weight: 400; }
.stage[aria-pressed=true] { border-color: var(--clay); } .steps { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-family: var(--sans); }
.chip.dash { background: none; border: 1px dashed var(--teal); color: var(--teal); }
#graph { width: 100%; height: 68vh; min-height: 420px; display: block; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); touch-action: none; user-select: none; cursor: grab; }
#graph .e { stroke: var(--gray); stroke-width: 1; vector-effect: non-scaling-stroke; } #graph .e.source, #graph .e.used { stroke: var(--teal); stroke-opacity: .55; } #graph .e.hi { stroke: var(--muted); stroke-opacity: 1; }
#graph .n { cursor: pointer; } #graph .n circle { fill: var(--muted); stroke: var(--bg); stroke-width: 1; } #graph .n.project circle { fill: var(--clay); } #graph .n.day circle { fill: var(--gray); }
#graph .n.skill circle { fill: var(--teal); } #graph .n.candidate circle { fill: var(--teal); fill-opacity: .3; stroke: var(--teal); stroke-width: 1.5; stroke-dasharray: 3 2; } #graph .n.tag circle { fill: var(--amber); }
#graph .n.pin circle { stroke: var(--fg); } #graph .n.match circle { stroke: var(--amber); stroke-width: 2.5; }
#graph text { font: 11px var(--sans); font-size: calc(11px / var(--k, 1)); fill: var(--muted); pointer-events: none; display: none; } /* --k = zoom: labels keep their size on screen */
#graph .n.project text, #graph .n.skill text, #graph .n.candidate text, #graph.zoom text, #graph .n.hi text, #graph .n.match text { display: block; } #graph .n.hi text, #graph .n.match text { fill: var(--fg); }
#graph.dim .n:not(.hi), #graph.dim .e:not(.hi), #graph.find .n:not(.match):not(.hi) { opacity: .15; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 1000px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .brain { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .app { flex-direction: column; } .rail { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 4px 12px 4px 0; font-size: 22px; } .grow, .status { display: none; } main { padding: 20px 16px; } .grid4 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">agent-router</div>
    <a href="#overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="#accounts"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Accounts &amp; routing</a>
    <a href="#cache"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Cache</a>
    <a href="#cost"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Cost &amp; budgets</a>
    <a href="#insights"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="5"/></svg>Insights</a>
    <a href="#brain"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 0 2 2h14v-4"/><path d="M9 8h6M9 12h4"/></svg>Brain</a>
    <div class="grow"></div>
    <div class="status" id="status" aria-live="polite">connecting…</div>
  </nav>
  <main id="main"></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const NA = '<span class="muted">—</span>';
const tok = (n) => n == null ? NA : n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}k` : String(Math.round(n));
const usd = (n) => n == null ? NA : `$${n >= 1000 ? Math.round(n).toLocaleString() : n.toFixed(2)}`; // dollars at list price
const code = (t) => esc(t).replace(/`([^`]+)`/g, '<span class="mono" style="color:var(--fg)">$1</span>'); // a fix line: `setting` in mono
const snippet = (t) => (t.match(/`([^`]+)`/) ?? t.match(/("[\w.]+": "[^"]+")/) ?? [0, t])[1]; // what Copy puts on the clipboard: the setting or command
const QUAL = { none: ['ok', 'no quality change'], unverified: ['warn', 'unverified'], 'docs-recommended': ['', 'docs-recommended'] };
const nice = (k) => k.replace(/^([a-z])([a-z]+)-(\d+)(?:-(\d+))?$/, (_, a, b, x, y) => `${a.toUpperCase()}${b} ${x}${y ? `.${y}` : ''}`); // opus-5-5 -> Opus 5.5
// what a dollar figure is in the paying account's windows: "≈ 1.2% of your 5-hour window · 0.3% of your week" from the server, '' when unknown
const lim = (t) => t ? `<span class="small muted" style="font-family:var(--sans);white-space:normal">${esc(t)}</span>` : '';
const hm = (ms) => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
// prompt-cache state of a session's main conversation: warm until cold_at, then the next turn re-writes the context
const warmChip = (s) => s.cold_at == null ? '' : s.cold_at > Date.now() ? `<span class="chip ok" title="After that the next turn re-writes the context${s.rebuild_usd == null ? '' : `: about $${s.rebuild_usd.toFixed(2)}${s.rebuild_limits ? ` (${esc(s.rebuild_limits)})` : ''}`}">warm · cold in ${dur((s.cold_at - Date.now()) / 1000)}</span>`
  : `<span class="chip" title="The cache lifetime has passed${s.rebuild_usd == null ? '' : `: the next turn re-writes the context, about $${s.rebuild_usd.toFixed(2)}${s.rebuild_limits ? ` (${esc(s.rebuild_limits)})` : ''}`}">cold</span>`;
// Keep warm, per session (only while the feature is on): being warmed -> until when, pings and their cost, Stop; otherwise the picker
// (its change handler shows the quote first) and, when the scheduler stopped, why
const warmCtl = (s) => { const w = s.warm, k = esc(s.session_key);
  if (!S.warm_enabled || s.cold_at == null) return '';
  if (w?.by && !w.stop) return `<span class="chip ok" title="${esc(w.by)}${w.next ? ` · next ping ${hm(w.next)}` : ''}">warm until ${hm(w.until)} · ${w.pings} ping${w.pings === 1 ? '' : 's'} · ${usd(w.usd)}</span><button class="sm" data-warmstop="${k}">Stop</button>`;
  return `<select class="sm" data-warm="${k}" aria-label="Keep this session warm"><option value="">Keep warm…</option>${[[1, '1h'], [2, '2h'], [4, '4h'], [S.warm_max_hours, 'until I’m back']].map(([h, l]) => `<option value="${h}">${l}</option>`).join('')}</select>${
    w?.stop ? `<span class="small amber" style="font-family:var(--sans);white-space:normal">Keep-warm stopped: ${esc(w.stop)}</span>` : ''}`; };
const bColor = (b) => b.state === 'over' ? 'var(--clay)' : b.state === 'warn' ? 'var(--amber)' : 'var(--teal)'; // teal < 80%, amber >= 80%, clay >= 100%
const pct = (x) => x == null ? NA : `${Math.round(x * 100)}%`;
const two = (n) => String(n).padStart(2, '0');
const dur = (s) => { if (s == null || s < 0) return '—'; s = Math.round(s);
  return s >= 86400 ? `${Math.floor(s / 86400)}d ${two(Math.floor(s % 86400 / 3600))}h` : s >= 3600 ? `${Math.floor(s / 3600)}h ${two(Math.floor(s % 3600 / 60))}m` : s >= 60 ? `${Math.floor(s / 60)}m` : `${s}s`; };
const ago = (ms) => ms ? `${dur((Date.now() - ms) / 1000)} ago` : 'never';
const until = (epochS) => epochS ? dur(epochS - Date.now() / 1000) : '—';
const hms = (ms) => new Date(ms).toLocaleTimeString('en-GB');
const short = (k) => esc((k ?? '').slice(0, 8));
// a session by name: title + muted project, key as tooltip; `m` = Map from byKey(sessions), unknown keys fall back to the short key
const SC = 'grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 70px 80px 110px 90px 200px'; // Sessions table
const MC = 'grid-template-columns:120px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 170px'; // Migrations table
const byKey = (sessions) => new Map(sessions.map((s) => [s.session_key, s]));
const sname = (m, k, s = m.get(k)) => `<span title="${esc(k)}">${s ? `${esc(s.title)}${s.project ? ` <span class="muted">${esc(s.project)}</span>` : ''}` : short(k)}</span>`;
const model = (m) => esc((m ?? '—').replace(/^claude-/, '').replace(/-\d{8}$/, ''));
const get = (p) => fetch(`/router/${p}`).then((r) => r.json());
const send = (method, p, body) => fetch(`/router/${p}`, { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) }).then((r) => r.json());
let S = {};            // last settings
const ui = { cacheSession: 'all', cacheDays: 7, whatif: 'all', tproj: 'all', open: {}, added: null, tl: null, busy: {}, b: {}, note: 'index.md', bq: '', bedit: false, files: [], bview: 'pipeline', pstage: null, sig: null }; // view state that survives re-renders
const kt = (n) => n == null ? '—' : `${Math.round(n / 1000)}k`;
const ctxColor = (s) => s.context_pct >= s.urgent_pct ? 'clay' : s.context_pct >= s.warn_pct ? 'amber' : 'muted';
// Session timeline: x = turn, one lane per account (first appearance order), bar = context (teal read + clay write cap)
const timelineSvg = (tl) => {
  const T = tl.turns; if (!T.length) return '<div class="note">No /v1/messages turns for this session yet.</div>';
  const lanes = [...new Set(T.map((r) => r.account_id))], now = T.at(-1).account_id, LH = 64, top = 34, x0 = 96, W = 680, step = W / T.length;
  const bw = Math.max(1, Math.min(14, step * .75)), max = Math.max(1, ...T.map((r) => r.context_total ?? 0)), H = top + lanes.length * LH + 18;
  const X = (k) => x0 + k * step, base = (a) => top + (lanes.indexOf(a) + 1) * LH - 6, hgt = (v) => v / max * (LH - 18), f = (n) => n.toFixed(1);
  let mi = 0;
  const marks = T.map((r, k) => { if (!r.migration) return ''; const m = r.migration, c = m.actual ?? m.est, x = X(k), end = x > x0 + W - 140;
    return `<line x1="${f(x)}" y1="${top - 6}" x2="${f(x)}" y2="${H - 18}" stroke="#D97757" stroke-dasharray="3 3"/><text x="${f(end ? x - 3 : x + 3)}" y="${mi++ % 2 ? 26 : 13}" text-anchor="${end ? 'end' : 'start'}" font-family="IBM Plex Mono" font-size="10" fill="#F3EFE7">${esc(`${m.from ?? '—'} → ${m.to}${c == null ? '' : ` · ${kt(c)}`}`)}</text>`; }).join('');
  const bars = T.map((r, k) => {
    const x = f(X(k)), y0 = base(r.account_id), j = r.context_total != null, read = j ? hgt(r.context_total - r.cache_create) : 0, cap = j ? hgt(r.cache_create) : 0;
    const tip = `turn ${r.i} · ${hms(r.ts)} · ${r.account_id} · ${r.model ?? ''}${r.agent_name ? `\nsubagent: ${r.agent_name}` : ''}\n${j ? `context ${kt(r.context_total)} · read ${kt(r.cache_read)} · write ${kt(r.cache_create)}` : 'usage not joined yet'}${r.burst ? `\nburst: ${r.burst.cause}` : ''}`;
    return `<g${r.agent_id ? ' opacity=".45"' : ''}><title>${esc(tip)}</title>${j ? `<rect x="${x}" y="${f(y0 - read)}" width="${f(bw)}" height="${f(read)}" fill="#5FB3A1"/><rect x="${x}" y="${f(y0 - read - cap)}" width="${f(bw)}" height="${f(cap)}" fill="#D97757"/>`
      : `<rect x="${x}" y="${y0 - 3}" width="${f(bw)}" height="3" fill="#4A453D"/>`}${r.burst ? `<circle cx="${f(X(k) + bw / 2)}" cy="${f(y0 - read - cap - 6)}" r="3" fill="${r.burst.avoidable ? '#E0A458' : '#A39E93'}"/>` : ''}</g>`; }).join('');
  const lanesSvg = lanes.map((a) => `<line x1="${x0 - 4}" y1="${base(a)}" x2="${x0 + W}" y2="${base(a)}" stroke="#2C2925"/><text x="4" y="${base(a) - 4}" font-family="IBM Plex Mono" font-size="11" fill="${a === now ? '#5FB3A1' : '#A39E93'}">${esc(a === now ? `now on ${a}` : a)}</text>`).join('');
  const key = (c, l, extra = '') => `<span class="row"><span class="dot" style="border-radius:2px;background:${c}${extra}"></span>${l}</span>`;
  return `<div class="row small muted" style="flex-wrap:wrap;gap:14px">${key('#5FB3A1', 'cache read')}${key('#D97757', 'cache write')}${key('#5FB3A1', 'subagent turn', ';opacity:.45')}${key('#E0A458', 'avoidable burst', ';border-radius:50%')}${key('#A39E93', 'burst', ';border-radius:50%')}<span class="clay">┆ account switch · cost (actual, else est.)</span><span>height = context · peak ${kt(max)}</span></div>
    <svg viewBox="0 0 790 ${H}" width="100%" role="img" aria-label="Timeline of ${T.length} turns across ${lanes.length} account${lanes.length === 1 ? '' : 's'}; now on ${esc(now)}">${lanesSvg}${bars}${marks}
      <text x="${x0}" y="${H - 4}" font-family="IBM Plex Mono" font-size="10" fill="#A39E93">turn ${T[0].i}</text><text x="${x0 + W}" y="${H - 4}" text-anchor="end" font-family="IBM Plex Mono" font-size="10" fill="#A39E93">turn ${T.at(-1).i}</text></svg>`;
};
const adviceCard = (s) => { const a = s.advice, b = a.breakdown ?? {}, k = esc(s.session_key);
  const line = (l, v) => `<div class="between mono"><span class="nm">${l}</span><span>${tok(v)}</span></div>`;
  return `<div class="inset" style="margin:2px 0 8px;border-color:${a.level === 'urgent' ? '#5A3328' : '#4A3A2E'}">
    <div class="between"><b>Context at ${pct(a.pct)} of ${tok(a.window)} — ${a.level === 'urgent' ? 'auto-compact is close' : 'before compact'}</b><span class="chip ${a.level === 'urgent' ? 'bad' : 'warn'}">${esc(a.level)} · ${ago(a.ts)}</span></div>
    <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div class="col small"><span class="muted">Largest tool results in context</span>${(b.top_results ?? []).map((r) => line(`${esc(r.tool)}${r.target !== r.tool ? ` <span class="muted">${esc(r.target)}</span>` : ''}${r.count > 1 ? ` ×${r.count}` : ''}`, r.tokens)).join('') || '<span class="muted">none</span>'}</div>
      <div class="col small"><span class="muted">Files read repeatedly</span>${(b.files_read_repeatedly ?? []).map((r) => line(`${esc(r.target)} ×${r.count}`, r.tokens)).join('') || '<span class="muted">none</span>'}
        <span class="muted" style="margin-top:6px">thinking ${tok(b.thinking_tokens_total)} · ${b.turns ?? '—'} turns · ${b.subagent_turns ?? 0} subagent turns</span></div>

// md:begin
// The Brain tab's Markdown renderer. Notes and imported skills are untrusted text: the whole source is HTML-escaped first and only then
// formatted. Links exist only for http(s) URLs and in-vault [[wikilinks]]; no raw HTML passes through. test_router.ts loads this block.
const md = (src) => {
  const lines = String(src ?? '').replace(/\r\n/g, '\n').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`).split('\n'), out = [];

  const inline = (t) => t.split(/(``.+?``|`[^`]+`)/).map((p, i) => i % 2 ? `<code>${p.replace(/^``? ?| ?``?$/g, '')}</code>` : p
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, to, as) => `<a href="#brain" data-wl="${to}">${as ?? to}</a>`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => /^https?:\/\//i.test(url) ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>` : m)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')).join('');
  let open = '', para = [], pre = null, fm = lines[0] === '---' ? [] : null;
  const close = () => { if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`); if (open) out.push(`</${open}>`); para = []; open = ''; };
  const into = (tag, row) => { if (para.length || open !== tag) { close(); out.push(`<${tag}>`); open = tag; } out.push(row); };
  lines.forEach((l, i) => {
    let m;
    if (fm) { if (i && l === '---') { out.push(`<pre class="muted">${fm.join('\n')}</pre>`); fm = null; } else if (i) fm.push(l); }
    else if (pre) { if (/^```/.test(l)) { out.push(`<pre>${pre.join('\n')}</pre>`); pre = null; } else pre.push(l); }
    else if (/^```/.test(l)) { close(); pre = []; }
    else if (/^&#60;!-- agent-router:(begin|end)[\w ]*--&#62;\s*$/.test(l)) close(); // our own block markers
    else if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = l.match(/^\s*(?:[-*]|(\d+)\.)\s+(.*)$/))) into(m[1] ? 'ol' : 'ul', `<li>${inline(m[2])}</li>`);
    else if (/^\|.*\|\s*$/.test(l)) { if (!/^[|\s:-]+$/.test(l)) into('table', `<tr>${l.trim().slice(1, -1).split('|').map((c) => `<td>${inline(c.trim())}</td>`).join('')}</tr>`); }
    else if (!l.trim()) close();
    else { if (open) close(); para.push(l); }
  });
  close();
  return out.join('\n') + (pre ? `<pre>${pre.join('\n')}</pre>` : '') + (fm ? `<pre>${fm.join('\n')}</pre>` : '');
};

// Laid out only when the set of visible notes or links changes; positions, pins, pan and zoom live in G and survive every re-render.
const GT = [['session', 'Sessions', 'muted'], ['project', 'Projects', 'clay'], ['day', 'Days', 'gray'], ['skill', 'Skills', 'teal'], ['tag', 'Tags', 'amber']];
const G = { key: '', N: [], E: [], adj: [], pos: {}, k: 1, tx: 0, ty: 0, moved: false, hover: null, drag: null, ptrs: new Map(), pinch: 0, ms: 0, on: { session: true, project: true, day: true, skill: true, tag: false } };

// Repulsion between every pair closer than 200, a spring along every link, a pull to the centre (stronger in y: the panel is wide);
// each step is capped and the cap cools to zero, so it runs to rest and stops (no animation loop). Pinned notes do not move.
// ponytail: O(n²) repulsion, every pair on every iteration: 200 notes × 300 iterations = 6M pair steps, measured 20–45 ms (500 notes:

// the visible notes and links for the current filter; a new set is laid out (old positions are the starting point) and, until the user

function gsync(g) {

// ---------- Cost: keep warm (GET /router/warm) ----------
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WARM_CONFIRM = 'Turn keep-warm on?\n\n1. The router will send requests on its own, with your login: it replays a session’s last request shortly before its cache lapses.\n2. Those requests count toward your 5-hour and weekly limits (and the daily budget below caps them).\n3. The last request of each large session is held in the router’s memory only: never written to disk, gone when it restarts.';
const warmPanel = (w) => { const st = w.settings, num = (k, l, step = 1, max = '') => `<label class="col small muted">${l}<input type="number" min="0" ${max && `max="${max}"`} step="${step}" name="${k}" value="${st[k]}" style="width:90px"></label>`;
  return `<section class="panel">
      <div class="between" style="flex-wrap:wrap"><h2>Keep warm</h2><span class="small muted">${usd(w.spent_today_usd)} of ${usd(st.warm_daily_usd)} spent on pings today · ${w.memory.entries} request${w.memory.entries === 1 ? '' : 's'} held in memory (${(w.memory.bytes / 1048576).toFixed(1)} MB)</span></div>
      <form id="warm" class="col" style="gap:12px">
        <label class="row"><input type="checkbox" name="warm_enabled" ${w.enabled ? 'checked' : ''}><span><b>Keep sessions warm</b> — replay a session’s last request ${st.warm_lead_min} min before its 1-hour cache lapses, so the next message reads the cache instead of re-writing it</span></label>
        <div class="row" style="flex-wrap:wrap;align-items:flex-end;gap:12px">${num('warm_daily_usd', 'Daily budget ($)', 0.25)}${num('warm_max_hours', 'Max hours per session', 1, 24)}${num('warm_after_stop_hours', 'Hours after I stop (0 = off)', 0.5, 24)}${num('warm_min_usd', 'Rules cover a rebuild of at least ($)', 0.25)}</div>
      </form>
      <div class="col small"><span class="muted">Rules — during this local-time window, keep matching sessions warm</span>
        ${st.warm_rules.map((r) => `<div class="between"><span><b>${esc(r.name)}</b> · ${r.days.map((d) => DAYS[d]).join(' ')} · <span class="mono">${esc(r.from)}–${esc(r.to)}</span> · ${r.scope === 'all' ? 'every session' : `project ${esc(r.match)}`}</span><button class="sm" data-act="rule-del" data-id="${esc(r.id)}" aria-label="Delete rule ${esc(r.name)}">Delete</button></div>`).join('') || '<span class="muted">No rules.</span>'}</div>
      <form id="rule-add" class="row" style="flex-wrap:wrap;align-items:flex-end;gap:12px">
        <label class="col small muted">Name<input name="name" required maxlength="80" placeholder="lunch"></label>
        <fieldset class="row small muted" style="border:0;padding:0;margin:0;gap:6px"><legend class="sr">Days</legend>${DAYS.map((d, i) => `<label class="row" style="gap:2px"><input type="checkbox" name="days" value="${i}" ${i > 0 && i < 6 ? 'checked' : ''}>${d}</label>`).join('')}</fieldset>
        <label class="col small muted">From<input name="from" type="time" required value="12:30"></label>
        <label class="col small muted">To<input name="to" type="time" required value="14:00"></label>
        <label class="col small muted">Scope<select name="scope"><option value="all">every session</option><option value="project">one project</option></select></label>
        <label class="col small muted">Project<input name="match" placeholder="only for one project"></label>
        <button class="sm">Add rule</button>
      </form>
      ${w.sessions.length ? `<div class="col small"><span class="muted">Sessions</span>${w.sessions.map((x) => `<div class="between"><span class="nm">${esc(x.title)} <span class="muted">${esc(x.by ?? '')}</span></span>
        <span class="${x.stop ? 'amber' : 'mono'}" style="text-align:right">${x.stop ? `stopped: ${esc(x.stop)}` : `warm until ${hm(x.until)} · ${x.next ? `next ping ${hm(x.next)}` : 'no further ping needed'} · ${x.pings} ping${x.pings === 1 ? '' : 's'} · ${usd(x.usd)}`}</span></div>`).join('')}</div>` : ''}
      ${w.pings.length ? `<details data-k="pings" ${ui.open.pings ? 'open' : ''}><summary>Recent pings (${w.pings.length})</summary><div class="col small mono" style="margin-top:6px">${w.pings.map((x) => `<div class="between"><span class="nm">${hms(x.ts)} · ${esc(x.title)} · ${esc(x.account)}</span>
        <span class="${x.status >= 300 ? 'clay' : ''}">${x.status} · read ${tok(x.cache_read)} · ${usd(x.usd)}</span></div>`).join('')}</div></details>` : ''}
      <div class="note">Off by default. Pings are requests the router sends on its own with your login; they count toward your limits and are logged with source <span class="mono">warm</span>. Only 1-hour caches are pinged. It stops by itself when the session becomes active, the time is up, the daily budget is spent, the account passes its warning threshold, or a ping fails. The desktop login (home) is only refreshed while the app is in use, so overnight warming of home can stop when it expires.</div>
    </section>`; };

// ---------- Insights: tool loading (GET /router/tools) ----------
const TC = 'grid-template-columns:minmax(0,1.4fr) 110px 60px 110px 100px minmax(0,1fr)';
const toolsPanel = (t) => `<section class="panel">
    <div class="between" style="flex-wrap:wrap"><h2>Tools — load upfront, defer or disable</h2>
      <div class="row"><span class="small muted">${t.days} days · ${t.sessions} sessions · ${t.turns.toLocaleString()} turns · ${t.tool_search.calls} tool searches in ${t.tool_search.sessions} sessions</span>
        <label class="sr" for="tp">Project</label><select id="tp" class="sm" data-act="tools-project"><option value="all">All projects</option>${t.projects.map((p) => `<option ${p === ui.tproj ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div></div>
    ${t.tool_search.class ? `<div class="inset warnbox"><div class="col"><b>Tool search is off in ${t.project === 'all' ? 'the newest session' : 'this project'}: every tool definition loads on every request</b><div class="small">${code(t.tool_search.fix)}</div></div></div>` : ''}
    <div class="table">
      <div class="tr th" style="${TC}"><span>MCP server</span><span>now</span><span>calls</span><span>sessions</span><span>last used</span><span>recommendation</span></div>
      ${t.servers.map((x) => `<div class="tr" style="${TC}"><span class="nm" title="${esc(x.server)}">${esc(x.server)} <span class="muted small">${esc(x.origin)}</span></span>
        <span>${x.loaded == null ? NA : x.loaded ? `${x.loaded} loaded${x.deferred ? ` · ${x.deferred} deferred` : ''}` : `${x.deferred} deferred`}</span><span>${x.calls}</span><span>${x.sessions} · ${pct(x.share)}</span><span>${x.last_used ? ago(x.last_used) : NA}</span>
        <span><span class="chip ${x.class === 'always_load' ? 'ok' : x.class === 'disable' ? 'warn' : ''}">${esc(x.label)}</span>${x.usd ? ` <span class="mono">${usd(x.usd)}</span>` : ''}</span></div>
        <div class="small" style="padding:0 10px 8px"><span class="muted">${x.evidence.map(esc).join(' · ')}</span> ${lim(x.limits)}
          ${x.change ? `<div class="between"><span>${code(x.change)}</span><button class="sm" data-fix="${esc(snippet(x.change))}" title="Copy the setting or command">Copy</button></div>` : ''}</div>`).join('') || '<div class="note">No tool calls in this range yet.</div>'}
    </div>
    <div class="col small"><span class="muted">Most-called tools</span>${t.tools.map((x) => `<div class="between mono"><span class="nm">${esc(x.name)}</span><span>${x.calls} calls · ${x.sessions} session${x.sessions === 1 ? '' : 's'}</span></div>`).join('')}</div>
    <div class="note">“Always load” = called in at least half of the sessions and deferred now, where the search round trips it would save cost more than carrying its definitions on every turn. “Disable” = not called in ${t.days} days. Built-in tools are listed for information. The router never edits your config: copy the change and apply it yourself; it takes effect in the next session.</div>
  </section>`;

// ---------- views: each returns [paths to fetch, render(data)] ----------
const views = {
  overview: [['overview', 'sessions', 'settings'], (o, sessions) => {
    const m = byKey(sessions), accts = o.accounts, paused = S.policy === 'manual';
    const src = o.sources ?? {}, srcLine = Object.keys(src).length ? `${src.desktop ?? 0} desktop · ${src.cli ?? 0} terminal sessions` : 'no user-agent data yet';
    const sw = o.switches, write = o.live.find((r) => r.cache === 'write');
    return head('Today', `${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })} · ${accts.length} accounts · ${o.live_sessions} live sessions`,
      `<div class="row"><button data-act="pause-routing" aria-pressed="${paused}" title="Manual policy: new sessions stay on home">${paused ? 'Resume routing' : 'Pause routing'}</button>
       <button class="primary" data-act="goto-add">Add account</button></div>`)
    + `<section class="grid4">
      ${kpi('Requests', o.requests_today, srcLine)}
      ${kpi('Cache hit rate', pct(o.cache_hit_rate), `${tok(o.per_turn.cache_read_avg)} read · ${tok(o.per_turn.cache_create_avg)} written per turn`, 'teal')}
      ${kpi('Switches', sw.manual + sw.forced + sw.ratelimited, `${sw.manual} manual · ${sw.forced} forced · ${sw.ratelimited} rate-limited`)}
      ${kpi('Headroom (5h)', pct(o.headroom_5h_pct), `of one account, pooled · resets ${dur(o.reset_in_s)}`)}
    </section>
    ${o.budgets.length ? `<a href="#cost" class="panel" style="flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 20px" aria-label="Budgets">
      <span class="label">Budgets</span>${o.budgets.map((b) => `<span class="row small" style="flex:1 1 220px;min-width:0"><span class="nm">${esc(b.name)}</span>${bar([[b.pct, bColor(b)]])}<span class="mono">${pct(b.pct)}</span></span>`).join('')}</a>` : ''}
    <section class="grid2">
      <div class="panel">
        <div class="between"><h2>Accounts</h2><a href="#accounts" class="small muted">Manage →</a></div>
        ${accts.map((a) => `<div class="inset" style="flex-direction:row;align-items:center;gap:16px;padding:14px">
          ${ring(a.util_5h, uColor(Math.max(a.util_5h ?? 0, a.util_7d ?? 0)))}
          <div class="col" style="flex-grow:1"><div class="row"><b>${esc(a.id)}</b>${badge(a.status)}<span class="small muted">${a.kind === 'home' ? 'desktop login' : esc(acctLine(a))}</span></div>
            <div class="small muted">5h ${pct(a.util_5h)} · ${(a.util_7d ?? 0) > (a.util_5h ?? 0) && (a.util_7d ?? 0) >= .5 ? `<span class="amber">7d ${pct(a.util_7d)} — weekly window is the constraint</span>` : `7d ${pct(a.util_7d)}`}
              · ${a.pinned_sessions} pinned · reset in ${until(a.reset_5h)}</div></div>
          <div class="mono small muted">${a.requests_today} req</div></div>`).join('')}
        <div class="inset warnbox" style="margin-top:auto">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2" style="flex-shrink:0;margin-top:2px" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <div class="col"><b>Router policy: ${esc(o.policy_line.split(' — ')[0])}</b><div class="note">${esc(o.policy_line.split(' — ')[1] ?? '')}. Live sessions stay pinned — a switch re-writes their whole cache.</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="between"><h2>Live</h2><span class="small muted row"><span class="dot" style="width:6px;height:6px"></span>polling 3s</span></div>
        <div class="table live">
          <div class="tr th"><span>time</span><span>account</span><span>session · model</span><span>cache</span><span>latency</span></div>
          ${o.live.map((r) => (r.migration ? `<div class="tr"><span class="muted">${hms(r.ts)}</span><span class="muted">—</span><span class="muted">${esc(r.migration.reason)} switch · ${sname(m, r.session_key)} ${esc(r.migration.from ?? '—')} → ${esc(r.migration.to)}</span><span></span><span></span></div>` : '')
            + `<div class="tr"><span class="muted">${hms(r.ts)}</span><span${r.account !== 'home' ? ' class="amber"' : ''}>${esc(r.account)}</span><span class="nm">${sname(m, r.session_key)} · ${model(r.model)}${r.status >= 400 ? ` <span class="clay">${r.status}</span>` : ''}</span>
              <span class="${r.cache === 'hit' ? 'teal' : r.cache === 'write' ? 'clay' : 'muted'}">${r.cache}</span><span>${(r.latency_ms / 1000).toFixed(2)}s</span></div>`).join('') || '<div class="note">No /v1/messages traffic yet.</div>'}
        </div>
        ${write ? `<a href="#cache" data-session="${esc(write.session_key)}" class="inset" style="margin-top:auto;text-align:center;font-size:13px">Why did ${hms(write.ts)} write ${tok(write.cache_create)}?</a>` : ''}
      </div>
    </section>`;
  }],

  accounts: [['accounts', 'sessions', 'migrations', () => ui.tl ? `sessions/${encodeURIComponent(ui.tl)}/timeline` : 'advice', 'settings'], (accts, sessions, migs, tl) => head('Accounts &amp; routing', 'Sticky per session. New sessions start on the account with the most headroom.',
      `<button class="primary" data-act="focus-add">Add account</button>`)
    + `<section class="cards">${accts.map((a) => `<div class="panel" style="gap:16px">
        <div class="between"><div class="row"><span style="font-size:18px;font-weight:600">${esc(a.id)}</span>${badge(a.status)}</div><span class="small muted">${esc(acctLine(a))}</span></div>
        ${[['5-hour window', a.util_5h, a.reset_5h], ['7-day window', a.util_7d, a.reset_7d]].map(([l, u, r]) =>
          `<div class="col"><div class="small muted">${l}</div>${bar([[u ?? 0, uColor(u)]])}<div class="small mono">${pct(u)} · resets ${until(r)}</div></div>`).join('')}
        ${a.status === 'cooling' ? `<div class="small amber">cooling ${dur((a.cooling_until - Date.now()) / 1000)} · ${esc(a.cooling_reason)}</div>` : ''}
        <div class="small muted">${a.pinned_sessions} pinned session${a.pinned_sessions === 1 ? '' : 's'} · ${a.requests_today} requests today · last seen ${ago(a.last_seen)}</div>
        ${ui.open[`relogin-${a.id}`] ? `<div class="cmd">CLAUDE_CONFIG_DIR=${esc(a.config_dir)} claude auth login</div>` : ''}
        <div class="row" style="flex-wrap:wrap">
          <button class="sm" data-a="${esc(a.id)}/${a.disabled ? 'resume' : 'pause'}">${a.disabled ? 'Resume' : 'Pause'}</button>
          <button class="sm" data-a="${esc(a.id)}/clear-cooldown" ${a.cooling_until > Date.now() ? '' : 'disabled'}>Clear cooldown</button>
          ${a.kind === 'home' ? '' : `<button class="sm" data-a="${esc(a.id)}/check">Check</button><button class="sm" data-act="relogin" data-id="${esc(a.id)}">Re-login</button><button class="sm" data-a="${esc(a.id)}/remove">Remove</button>`}
        </div></div>`).join('')}
      <form class="panel dashed" id="add" style="gap:12px">
        <div style="font-size:15px;font-weight:600">Add another account</div>
        <div class="note">Give it a name, then run the login command it prints in any terminal. The official OAuth flow stores the token; the router reads it at request time and never displays it.</div>
        <label class="col small muted">Account name<input name="id" id="add-id" placeholder="acct-c" pattern="[\\w.\\-]{1,64}" required></label>
        ${ui.added ? `<div class="cmd">${esc(ui.added.login_cmd)}</div><button type="button" class="sm" data-a="${esc(ui.added.id)}/check">Check login</button>` : '<button class="sm">Create</button>'}
      </form></section>
    <section class="panel">
      <div class="between"><h2>Sessions</h2><span class="small muted">Switch cost = a full cache re-write of that session's context. Shown before you confirm.</span></div>
      <div class="table">
        <div class="tr th" style="${SC}"><span>session · project</span><span>model</span><span>requests</span><span>account</span><span>context</span><span>switch cost</span><span>route to</span></div>
        ${sessions.map((s) => `<div class="tr" style="${SC}">
          <span class="nm"><button class="plain nm" data-tl="${esc(s.session_key)}" aria-expanded="${ui.tl === s.session_key}" title="Show timeline">${sname(null, s.session_key, s)}</button></span>
          <span class="row" style="flex-wrap:wrap;gap:4px">${model(s.last_model)} ${s.source ? `<span class="chip">${s.source === 'cli' ? 'terminal' : 'desktop'}</span>` : ''} ${warmChip(s)}${warmCtl(s)}</span>
          <span>${s.request_count}</span><span${s.account_id !== 'home' ? ' class="amber"' : ''}>${esc(s.account_id)}</span><div class="col meter" style="gap:3px"><span>${tok(s.context_main ?? s.context_est)} <span class="${ctxColor(s)}">${pct(s.context_pct)}</span></span>${s.context_pct == null ? '' : bar([[s.context_pct, `var(--${ctxColor(s) === 'muted' ? 'teal' : ctxColor(s)})`]])}</div>
          <span>${s.last_switch_cost_actual != null ? `<span title="last switch, actual cache write">${tok(s.last_switch_cost_actual)}</span>` : s.switch_cost_est == null ? NA : '≈' + tok(s.switch_cost_est)}</span>
          <div class="row"><select class="sm" aria-label="Route session ${short(s.session_key)} to account" data-s="${esc(s.session_key)}">${accts.map((a) => `<option ${a.id === (ui.open[`pin-${s.session_key}`] ?? s.account_id) ? 'selected' : ''}>${esc(a.id)}</option>`).join('')}</select>
            <button class="sm" data-pin="${esc(s.session_key)}" data-cost="${s.switch_cost_est ?? ''}" data-actual="${s.last_switch_cost_actual ?? ''}">Switch</button></div></div>`
          + (ui.tl === s.session_key && tl?.turns ? `<div class="inset" style="margin:2px 0 8px"><div class="between"><b>Timeline — ${esc(tl.title)}</b><span class="small muted">${tl.turns.length} turns · hover a bar for its numbers</span></div>${timelineSvg(tl)}
            ${tl.carrying?.length ? `<div class="col small"><span class="muted">Carrying cost — tool results that every later turn re-read (tokens × turns × the model's read price)</span>
              ${tl.carrying.map((c) => `<div class="between mono"><span class="nm">${esc(c.tool)}${c.target !== c.tool ? ` <span class="muted">${esc(c.target)}</span>` : ''}</span><span>${tok(c.tokens)} × ${c.turns} turns · ${usd(c.usd)}</span></div>`).join('')}
              <span class="muted">Top one: ${code(tl.carrying[0].suggestion)}</span></div>` : ''}</div>` : '')
          + (s.advice ? adviceCard(s) : '')
          + s.agents.map((a) => `<div class="tr" style="${SC}"><span class="nm muted" style="padding-left:14px" title="${esc(a.agent_id)}">↳ ${esc(a.name)}</span>
            <span class="small muted">read ${tok(a.cache_read)} · write ${tok(a.cache_create)}</span><span>${a.requests}</span><span></span><span></span><span></span><span></span></div>`).join('')).join('') || '<div class="note">No sessions yet.</div>'}
      </div>
      ${sessions.some((s) => s.agents.length) ? '<div class="note">↳ rows are subagents. Their requests are included in the parent\'s count and follow the parent\'s pin — switch the parent to move them.</div>' : ''}
      <div class="note">Click a session's name for its turn-by-turn timeline.</div>
      <fieldset class="inset" style="margin:0"><legend class="small muted" style="padding:0 4px">Routing policy</legend>
        ${[['sticky_least_utilized', 'Sticky, least-utilized for new sessions', ' <span class="muted">(recommended)</span>'], ['prefer_home_until_80', 'Prefer home until 80%', ''], ['manual', 'Manual only', ' <span class="muted">(new sessions stay on home)</span>']].map(([v, l, x]) =>
          `<label class="row"><input type="radio" name="policy" value="${v}" ${S.policy === v ? 'checked' : ''}> ${l}${x}</label>`).join('')}
        <div class="small muted">Forced switch on 429 / 529 · cooldown from reset headers · new sessions avoid accounts over ${pct(S.route_cutoff_pct)} (5h) or inside the ${pct(S.weekly_reserve_pct)} weekly reserve</div>
      </fieldset>
    </section>
    <section class="panel">
      <div class="between"><h2>Migrations</h2><span class="small muted">est = request bytes / 4 · actual = cache write of the first turn after, from the transcript</span></div>
      <div class="table">
        <div class="tr th" style="${MC}"><span>time</span><span>session</span><span>from → to</span><span>reason</span><span>cost est → actual</span></div>
        ${migs.slice(0, 20).map((g) => `<div class="tr" style="${MC}"><span class="muted">${new Date(g.ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
          <span class="nm">${sname(byKey(sessions), g.session_key)}</span><span>${esc(g.from_account ?? '—')} → ${esc(g.to_account)}</span><span class="nm ${/^proactive/.test(g.reason) ? 'amber' : /^(429|529)/.test(g.reason) ? 'clay' : g.reason === 'manual' ? 'muted' : ''}">${esc(g.reason)}</span>
          <span>${g.est_cost_tokens == null ? NA : '≈' + tok(g.est_cost_tokens)} → ${g.actual_cost_tokens == null ? NA : `<span class="clay">${tok(g.actual_cost_tokens)}</span>`}</span></div>`).join('') || '<div class="note">No switches yet.</div>'}
      </div>
    </section>`],

  cache: [[() => `cache?session=${encodeURIComponent(ui.cacheSession)}&days=${ui.cacheDays}`, 'sessions', 'settings'], (c, sessions) => {
    const m = byKey(sessions), t = c.turns.slice(-60), max = Math.max(1, ...t.map((r) => (r.cache_read ?? 0) + (r.cache_create ?? 0) + (r.in_tok ?? 0)));
    const step = 700 / Math.max(t.length, 1), bw = Math.min(22, step - 4), y = (v) => (v / max) * 200;
    const bars = t.map((r, k) => { const x = 44 + k * step; let top = 260; const seg = (v, fill) => { const h = y(v ?? 0); top -= h; return h > 0 ? `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}"/>` : ''; };
      return `<g><title>turn ${r.i}${ui.cacheSession === 'all' ? ` (${esc(m.get(r.session_key)?.title ?? (r.session_key ?? '').slice(0, 8))})` : ''} · ${hms(r.ts)}\nread ${r.cache_read ?? '—'} · write ${r.cache_create ?? '—'} · uncached ${r.in_tok ?? '—'}${r.burst ? `\nburst: ${r.burst.cause}` : ''}</title>${seg(r.cache_read, '#5FB3A1')}${seg(r.cache_create, '#D97757')}${seg(r.in_tok, '#4A453D')}
        ${r.burst ? `<text x="${(x + bw / 2).toFixed(1)}" y="276" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#D97757">${r.i}</text>` : ''}</g>`; }).join('');
    const DESC = { account: 'The cache is per account, so the whole context was written again.', model: 'The cache is per model: a switch writes the whole context again on the new one.',
      fast: 'Fast mode is part of the cache key: turning it on writes the context again.', effort: 'On this model a change of effort re-writes the conversation.',

// ---------- routing, polling, rendering ----------
const route = () => { const r = location.hash.slice(1).split('?')[0]; return views[r] ? r : 'overview'; };
// deep link to a session's timeline: #accounts?tl=<session key>
// …and to a Brain view: #brain?view=pipeline|notes|graph
const deep = () => { const q = new URLSearchParams(location.hash.split('?')[1] ?? ''); if (q.get('tl')) ui.tl = q.get('tl'); ui.bview = ['notes', 'graph'].includes(q.get('view')) ? q.get('view') : 'pipeline'; };
let seq = 0;
async function refresh(force) {
  const r = route(), [paths, render] = views[r], my = ++seq;
  document.querySelectorAll('.rail a').forEach((a) => a.toggleAttribute('aria-current', a.getAttribute('href') === `#${r}`));
  try {
    const [h, ...data] = await Promise.all(['health', ...paths.map((p) => (typeof p === 'function' ? p() : p))].map(get));
    if (my !== seq) return; // a newer refresh (route change) superseded this one
    if (data.at(-1)?.policy) S = data.at(-1); else if (data[0]?.settings) S = data[0].settings;
    $('#status').innerHTML = `<div class="row"><span class="dot" style="background:${h.transparent ? 'var(--teal)' : 'var(--amber)'}"></span><span style="color:var(--fg)">Transparent mode ${h.transparent ? 'on' : 'off'}</span></div>
      <div>${h.launchd ? 'launchd' : 'manual run'} · up ${dur(h.uptime)}</div><div class="mono">${h.transparent ? 'api.anthropic.com → 127.0.0.1' : 'explicit :4001 only'}</div>
      <div>${h.requests.toLocaleString()} requests · ${h.sessions} sessions</div>`;
    // never yank a control out from under the user; the next tick catches up
    const f = document.activeElement, main = $('#main');
    // never yank a control out from under the user: focus anywhere in a form (buttons included) or a half-typed
    // field means the poll waits; clicking Create used to move focus to the button and get the form re-rendered away
    const dirty = [...main.querySelectorAll('input, textarea')].some((i) => i.type !== 'radio' && i.type !== 'checkbox' && i.value !== i.defaultValue);
    if (!force && ((f && main.contains(f) && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(f.tagName)) || dirty || G.drag)) return;
    // Brain pipeline and graph: a poll that brought nothing new is not rendered, so scroll, hover, pan, zoom and pins stay put
    const sig = r === 'brain' && ui.bview !== 'notes' ? ui.bview + JSON.stringify(data) : null;
    if (!force && sig && sig === ui.sig) return;
    ui.sig = sig;
    const keep = [...main.querySelectorAll('[data-scroll]')].map((x) => [x.dataset.scroll, x.scrollTop]); // inner scrollers survive the re-render
    $('#main').innerHTML = render(...data);
    for (const [k, y] of keep) { const x = main.querySelector(`[data-scroll="${k}"]`); if (x) x.scrollTop = y; }
    document.title = `agent-router`;
  } catch (e) {
    $('#status').innerHTML = `<span class="err">router unreachable: ${esc(e.message)}</span>`;
  }
}
async function act(path, body, method = 'POST') {
  const r = await send(method, path, body);
  if (r?.error || r?.ok === false) alert(JSON.stringify(r.error ?? r));
  await refresh(true);
  return r;
}
const putSettings = (patch) => act('settings', patch, 'PUT');
async function brainAct(d) {
  const a = d.bact, skill = `brain/skills/${encodeURIComponent(d.name)}/${a}`;
  if (a === 'clear') { ui.bq = ''; ui.bedit = false; refresh(true); }
  if (a === 'edit') { ui.bedit = true; refresh(true); }
  if (a === 'capture' || a === 'recall') act(`brain/${a}`);
  if (a === 'open') act('brain/open', { target: d.target });
  if (a === 'greset') { Object.assign(G, { pos: {}, key: '', moved: false }); refresh(true); }
  if (a === 'scan-all' || a === 'extract-all') { // background run on the server: confirm with the count, the estimate and what is left of the cap
    const scan = a === 'scan-all', n = Number(d.n);
    if (confirm(`${scan ? 'Scan' : 'Extract'} ${n} session${n === 1 ? '' : 's'} with ${d.by}, one after the other?\n\n${d.est === '' ? 'No cost history yet, so no estimate: the first calls set it.' : `About $${Number(d.est).toFixed(2)} at list price (${n} × the recent average per call).`}\n$${Number(d.left).toFixed(2)} of today's cap is left; it stops there.`)) act(`brain/${a}`);
  }
  if (a === 'disable' && confirm('Turn the brain off? Notes stay where they are; nothing new is written.')) putSettings({ brain_enabled: false });
  if (a === 'promote' && confirm(`Promote ${d.name}? It is copied to your Claude skills folder and every new session loads its description.`)) act(skill);
  if (a === 'demote') act(skill);
  if (a === 'reject' && confirm(`Reject ${d.name}? The candidate is deleted.`)) act(skill).then(() => { ui.note = 'index.md'; refresh(true); });
  if (a === 'scan' || a === 'distill' || a === 'force' || a === 'consolidate') { // model calls: seconds to minutes
    ui.busy.brain = d.sk ?? true; refresh(true);
    const r = await send('POST', a === 'consolidate' ? 'brain/consolidate' : a === 'scan' ? 'brain/scan' : 'brain/distill', a === 'consolidate' ? { project: d.name } : { session: d.sk, force: a === 'force' }).catch((e) => ({ error: { type: e.message } }));
    delete ui.busy.brain;
    if (r?.error) alert(`Failed: ${r.error.type}`); else if (r?.queued) alert('The daily brain cap is spent. Queued: it runs when the cap frees up.');
    refresh(true);
  }
}

    e.preventDefault();
    const w = d.wl.replace(/\.md$/, ''), hit = ui.files.find((p) => p === `${w}.md`) ?? ui.files.find((p) => p.endsWith(`/${w.split('/').pop()}.md`));
    if (hit) { ui.note = hit; refresh(true); }
  }
  if (d.bact) brainAct(d);
  if (d.session) { ui.cacheSession = d.session; return; } // then the #cache link navigates
  if (d.a) { const [id, action] = d.a.split('/'); if (action !== 'remove' || confirm(`Remove ${id}? Its sessions fall back to another account.`)) act(`accounts/${encodeURIComponent(id)}/${action}`); }
  if (d.tl) { ui.tl = ui.tl === d.tl ? null : d.tl; refresh(true); }
  if (d.handoff) {
    ui.busy[d.handoff] = true; refresh(true);
    send('POST', `sessions/${encodeURIComponent(d.handoff)}/handoff`).then((r) => { if (r?.error) alert(`Handoff failed: ${r.error.type}`); }).finally(() => { delete ui.busy[d.handoff]; refresh(true); });
  }
  if (d.fix) navigator.clipboard.writeText(d.fix).then(() => { t.textContent = 'Copied'; });
  if (d.copy) navigator.clipboard.writeText(document.querySelector(`pre[data-ho="${CSS.escape(d.copy)}"]`).textContent).then(() => { t.textContent = 'Copied'; });
  if (d.pin) {
    const acct = document.querySelector(`select[data-s="${CSS.escape(d.pin)}"]`).value;
    const cost = d.actual ? ` — last switch cost ${kt(Number(d.actual))} tokens` : d.cost ? `: ≈${Number(d.cost).toLocaleString()} tokens` : '';
    if (confirm(`Route session ${d.pin.slice(0, 8)} to ${acct}?\nIts next turn re-writes the whole cache on ${acct}${cost}.`))
      act(`sessions/${encodeURIComponent(d.pin)}/pin`, { account_id: acct }).then(() => delete ui.open[`pin-${d.pin}`]);
  }
  if (d.act === 'pause-routing') putSettings({ policy: S.policy === 'manual' ? 'sticky_least_utilized' : 'manual' });
  if (d.act === 'focus-add') $('#add-id')?.focus();
  if (d.act === 'goto-add') { location.hash = '#accounts'; setTimeout(() => $('#add-id')?.focus(), 400); }
  if (d.act === 'relogin') { ui.open[`relogin-${d.id}`] = !ui.open[`relogin-${d.id}`]; refresh(true); }
  if (d.act === 'budget-del' && confirm('Delete this budget?')) putSettings({ budgets: S.budgets.filter((b) => b.id !== d.id) });
  if (d.act === 'rule-del' && confirm('Delete this rule?')) putSettings({ warm_rules: S.warm_rules.filter((r) => r.id !== d.id) });
  if (d.warmstop) act(`sessions/${encodeURIComponent(d.warmstop)}/warm`, {}, 'DELETE');
  if (d.act === 'rate-del') { const rc = { ...S.rate_card }; delete rc[d.m]; putSettings({ rate_card: rc }); }
  if (d.act === 'rate-add') {
    const f = new FormData($('#budgets')), m = String(f.get('rc_model')).trim();
    if (!m) return alert('Which model ids the override applies to is required');
    // only the fields that were filled in override the built-in price
    putSettings({ rate_card: { ...S.rate_card, [m]: Object.fromEntries(['input', 'write_5m', 'write_1h', 'read', 'output'].filter((k) => f.get(`rc_${k}`) !== '').map((k) => [k, Number(f.get(`rc_${k}`))])) } });
  }
});
document.addEventListener('change', (e) => {
  const t = e.target, d = t.dataset;
  if (d.s) ui.open[`pin-${d.s}`] = t.value;
  if (d.act === 'cache-session') { ui.cacheSession = t.value; refresh(true); }
  if (d.act === 'cache-days') { ui.cacheDays = Number(t.value); refresh(true); }
  if (d.act === 'whatif') { ui.whatif = t.value; refresh(true); }
  if (d.act === 'tools-project') { ui.tproj = t.value; refresh(true); }
  if (d.act === 'facts-load') act('brain/facts-load', { on: t.checked });
  if (d.warm && t.value) { // Keep warm: the quote first (ping and rebuild cost in dollars and in % of the windows, pings needed, break-even), then the one-off
    const hours = Number(t.value), path = `sessions/${encodeURIComponent(d.warm)}/warm`;
    get(`${path}?hours=${hours}`).then((q) => { t.value = ''; if (q.error) return alert('This session has no warm cache to keep.'); if (confirm(q.text)) act(path, { hours }); });
  }
  if (t.closest('#warm')) {
    const v = Number(t.value);
    if (t.name === 'warm_enabled') { if (!t.checked || confirm(WARM_CONFIRM)) putSettings({ warm_enabled: t.checked }); else t.checked = false; }
    else if (t.value !== '' && v >= 0 && (t.name !== 'warm_max_hours' || (v > 0 && v <= 24))) putSettings({ [t.name]: v }); else alert(t.name === 'warm_max_hours' ? 'Enter 1–24 hours' : 'Enter a number, 0 or more');
  }
  if ('b' in d) { // Add-budget selects: remembered across polls; a session cap is always per session
    const f = t.form, s = f.elements;
    if (s.scope.value === 'session') s.period.value = 'session';
    ui.b = { scope: s.scope.value, period: s.period.value, action: s.action.value, unit: s.unit.value };
    f.querySelector('[data-match]').hidden = !/project|account/.test(ui.b.scope);
    s.match.setAttribute('list', `bm-${ui.b.scope}`);
  }
  if (t.name === 'policy') putSettings({ policy: t.value });
  if (t.name === 'notify') putSettings({ notify: t.checked });
  if (t.closest('#budgets') && /_pct$|_gain$/.test(t.name)) {
    const v = Number(t.value);
    if (v >= 0 && v <= 100) putSettings({ [t.name]: v / 100 }); else alert('Enter 0–100');
  }
});
document.addEventListener('toggle', (e) => { if (e.target.dataset?.k) ui.open[e.target.dataset.k] = e.target.open; }, true);
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target), fid = e.target.getAttribute('id'); // form.id is shadowed by the <input name="id"> inside #add
  if (fid === 'add') {
    const id = String(f.get('id')).trim(), r = await act('accounts', { id });
    if (r.login_cmd) { ui.added = { id, login_cmd: r.login_cmd }; refresh(true); }
  }
  if (fid === 'budget-add') {
    const scope = f.get('scope'), limit = Number(f.get('limit'));
    if (!(limit > 0)) return alert('Limit: dollars at list price (e.g. 20), or percentage points of a window (e.g. 5)');
    const r = await putSettings({ budgets: [...(S.budgets ?? []), { id: `b${Date.now()}`, name: String(f.get('name')).trim(), scope, match: /project|account/.test(scope) ? String(f.get('match')).trim() : null,
      period: scope === 'session' ? 'session' : f.get('period'), limit, unit: f.get('unit'), action: f.get('action'), thresholds: [0.8, 1] }] });
    if (!r?.error) { ui.b = {}; refresh(true); }
  }
  if (fid === 'rule-add') {
    const scope = f.get('scope'), match = String(f.get('match')).trim();
    if (scope === 'project' && !match) return alert('Which project? Its name is the folder the session runs in.');
    putSettings({ warm_rules: [...(S.warm_rules ?? []), { id: `r${Date.now()}`, name: String(f.get('name')).trim(), days: f.getAll('days').map(Number), from: f.get('from'), to: f.get('to'), scope, match: scope === 'project' ? match : null }] });
  }
  if (fid === 'brain-enable') putSettings({ brain_enabled: true, brain_dir: String(f.get('dir')).trim() || null });
  if (fid === 'brain-search') { ui.bq = String(f.get('q')).trim(); refresh(true); }
  if (fid === 'brain-facts') { await act('brain/facts', { text: String(f.get('text')) }, 'PUT'); ui.bedit = false; refresh(true); }
  if (fid === 'brain-import') { const r = await act('brain/skills/import', { url: String(f.get('url')).trim() }); if (r?.name) { ui.note = `skills/candidates/${r.name}/SKILL.md`; refresh(true); } }
  if (fid === 'brain-settings') {
    const cap = Number(f.get('brain_daily_usd'));
    if (f.get('brain_daily_usd') === '' || !(cap >= 0)) return alert('Daily cap: dollars at list price, e.g. 1');
    putSettings({ brain_distill: f.get('brain_distill'), brain_daily_usd: cap, classifier: f.get('classifier') });
  }
});
addEventListener('hashchange', () => { deep(); refresh(true); });
deep(); refresh(true);
setInterval(refresh, 3000);
</script>
