<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: dark; --bg: #151412; --rail: #1A1816; --panel: #1E1C19; --line: #2C2925; --fg: #F3EFE7; --muted: #A39E93;
  --clay: #D97757; --teal: #5FB3A1; --amber: #E0A458; --gray: #4A453D; --serif: 'Instrument Serif', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
a { color: var(--fg); text-decoration: none; } a:hover { color: var(--clay); }
.app { display: flex; min-height: 100vh; }
.rail { width: 220px; flex-shrink: 0; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); background: var(--rail); position: sticky; top: 0; height: 100vh; }
.brand { font: 26px var(--serif); padding: 4px 12px 20px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--muted); }
.rail a[aria-current] { background: var(--line); color: var(--fg); font-weight: 500; }
.rail svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; }
.grow { flex-grow: 1; }
main { flex-grow: 1; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font: 400 34px var(--serif); } h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel { padding: 20px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.inset { padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.warnbox { background: #2A2320; border-color: #4A3A2E; flex-direction: row; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; } .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 4px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.kpi { padding: 18px 20px; gap: 6px; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.big { font: 30px var(--mono); }
.muted { color: var(--muted); } .small { font-size: 12px; } .note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.mono { font-family: var(--mono); } .teal { color: var(--teal); } .clay { color: var(--clay); } .amber { color: var(--amber); }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: #23342F; color: var(--teal); } .chip.warn { background: #3A2E24; color: var(--amber); } .chip.bad { background: #3A2420; color: var(--clay); }
button, select, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
button { cursor: pointer; font-weight: 500; } button:hover:not(:disabled) { border-color: var(--muted); } button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--clay); border-color: var(--clay); color: var(--bg); font-weight: 600; }
button.sm, select.sm { padding: 6px 10px; border-radius: 6px; }
input[type=number] { width: 72px; font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.seg button { border: none; background: transparent; color: var(--muted); padding: 7px 12px; }
.seg button[aria-pressed=true] { background: var(--line); color: var(--fg); }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; display: flex; flex-grow: 1; }
.bar > div { height: 100%; }
.table { display: flex; flex-direction: column; gap: 2px; overflow-x: auto; }
.tr { display: grid; gap: 12px; padding: 10px; border-radius: 8px; align-items: center; font: 13px var(--mono); min-width: 760px; }
.tr:nth-child(even) { background: var(--bg); } .tr.th { color: var(--muted); font: 12px var(--sans); }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live .tr { grid-template-columns: 70px 76px 1fr 56px 64px; gap: 8px; padding: 8px; font-size: 12px; min-width: 420px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); display: inline-block; flex-shrink: 0; }
.status { padding: 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.dashed { background: var(--rail); border-style: dashed; border-color: var(--gray); }
pre, .cmd { font: 12px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.err { color: var(--clay); }
.plain { border: 0; background: none; padding: 0; font: inherit; text-align: left; max-width: 100%; } .plain:hover { color: var(--clay); }
.meter .bar { height: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 1000px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .app { flex-direction: column; } .rail { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 4px 12px 4px 0; font-size: 22px; } .grow, .status { display: none; } main { padding: 20px 16px; } .grid4 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">agent-router</div>
    <a href="#overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="#accounts"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Accounts &amp; routing</a>
    <a href="#cache"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Cache</a>
    <a href="#cost"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Cost &amp; budgets</a>
    <a href="#insights"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="5"/></svg>Insights</a>
    <div class="grow"></div>
    <div class="status" id="status" aria-live="polite">connecting…</div>
  </nav>
  <main id="main"></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const NA = '<span class="muted">—</span>';
const tok = (n) => n == null ? NA : n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}k` : String(Math.round(n));
const pct = (x) => x == null ? NA : `${Math.round(x * 100)}%`;
const two = (n) => String(n).padStart(2, '0');
const dur = (s) => { if (s == null || s < 0) return '—'; s = Math.round(s);
  return s >= 86400 ? `${Math.floor(s / 86400)}d ${two(Math.floor(s % 86400 / 3600))}h` : s >= 3600 ? `${Math.floor(s / 3600)}h ${two(Math.floor(s % 3600 / 60))}m` : s >= 60 ? `${Math.floor(s / 60)}m` : `${s}s`; };
const ago = (ms) => ms ? `${dur((Date.now() - ms) / 1000)} ago` : 'never';
const until = (epochS) => epochS ? dur(epochS - Date.now() / 1000) : '—';
const hms = (ms) => new Date(ms).toLocaleTimeString('en-GB');
const short = (k) => esc((k ?? '').slice(0, 8));
// a session by name: title + muted project, key as tooltip; `m` = Map from byKey(sessions), unknown keys fall back to the short key
const SC = 'grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 80px 90px 110px 100px 210px'; // Sessions table
const MC = 'grid-template-columns:120px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 170px'; // Migrations table
const byKey = (sessions) => new Map(sessions.map((s) => [s.session_key, s]));
const sname = (m, k, s = m.get(k)) => `<span title="${esc(k)}">${s ? `${esc(s.title)}${s.project ? ` <span class="muted">${esc(s.project)}</span>` : ''}` : short(k)}</span>`;
const model = (m) => esc((m ?? '—').replace(/^claude-/, '').replace(/-\d{8}$/, ''));
const get = (p) => fetch(`/router/${p}`).then((r) => r.json());
const send = (method, p, body) => fetch(`/router/${p}`, { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) }).then((r) => r.json());
let S = {};            // last settings
const ui = { cacheSession: 'all', cacheDays: 7, dollars: false, open: {}, added: null, tl: null, busy: {} }; // view state that survives re-renders
const kt = (n) => n == null ? '—' : `${Math.round(n / 1000)}k`;
const ctxColor = (s) => s.context_pct >= s.urgent_pct ? 'clay' : s.context_pct >= s.warn_pct ? 'amber' : 'muted';
// Session timeline: x = turn, one lane per account (first appearance order), bar = context (teal read + clay write cap)
const timelineSvg = (tl) => {
  const T = tl.turns; if (!T.length) return '<div class="note">No /v1/messages turns for this session yet.</div>';
  const lanes = [...new Set(T.map((r) => r.account_id))], now = T.at(-1).account_id, LH = 64, top = 34, x0 = 96, W = 680, step = W / T.length;
  const bw = Math.max(1, Math.min(14, step * .75)), max = Math.max(1, ...T.map((r) => r.context_total ?? 0)), H = top + lanes.length * LH + 18;
  const X = (k) => x0 + k * step, base = (a) => top + (lanes.indexOf(a) + 1) * LH - 6, hgt = (v) => v / max * (LH - 18), f = (n) => n.toFixed(1);
  let mi = 0;
  const marks = T.map((r, k) => { if (!r.migration) return ''; const m = r.migration, c = m.actual ?? m.est, x = X(k), end = x > x0 + W - 140;
    return `<line x1="${f(x)}" y1="${top - 6}" x2="${f(x)}" y2="${H - 18}" stroke="#D97757" stroke-dasharray="3 3"/><text x="${f(end ? x - 3 : x + 3)}" y="${mi++ % 2 ? 26 : 13}" text-anchor="${end ? 'end' : 'start'}" font-family="IBM Plex Mono" font-size="10" fill="#F3EFE7">${esc(`${m.from ?? '—'} → ${m.to}${c == null ? '' : ` · ${kt(c)}`}`)}</text>`; }).join('');
  const bars = T.map((r, k) => {
    const x = f(X(k)), y0 = base(r.account_id), j = r.context_total != null, read = j ? hgt(r.context_total - r.cache_create) : 0, cap = j ? hgt(r.cache_create) : 0;
    const tip = `turn ${r.i} · ${hms(r.ts)} · ${r.account_id} · ${r.model ?? ''}${r.agent_name ? `\nsubagent: ${r.agent_name}` : ''}\n${j ? `context ${kt(r.context_total)} · read ${kt(r.cache_read)} · write ${kt(r.cache_create)}` : 'usage not joined yet'}${r.burst ? `\nburst: ${r.burst.cause}` : ''}`;
    return `<g${r.agent_id ? ' opacity=".45"' : ''}><title>${esc(tip)}</title>${j ? `<rect x="${x}" y="${f(y0 - read)}" width="${f(bw)}" height="${f(read)}" fill="#5FB3A1"/><rect x="${x}" y="${f(y0 - read - cap)}" width="${f(bw)}" height="${f(cap)}" fill="#D97757"/>`
      : `<rect x="${x}" y="${y0 - 3}" width="${f(bw)}" height="3" fill="#4A453D"/>`}${r.burst ? `<circle cx="${f(X(k) + bw / 2)}" cy="${f(y0 - read - cap - 6)}" r="3" fill="${r.burst.avoidable ? '#E0A458' : '#A39E93'}"/>` : ''}</g>`; }).join('');
  const lanesSvg = lanes.map((a) => `<line x1="${x0 - 4}" y1="${base(a)}" x2="${x0 + W}" y2="${base(a)}" stroke="#2C2925"/><text x="4" y="${base(a) - 4}" font-family="IBM Plex Mono" font-size="11" fill="${a === now ? '#5FB3A1' : '#A39E93'}">${esc(a === now ? `now on ${a}` : a)}</text>`).join('');
  const key = (c, l, extra = '') => `<span class="row"><span class="dot" style="border-radius:2px;background:${c}${extra}"></span>${l}</span>`;
  return `<div class="row small muted" style="flex-wrap:wrap;gap:14px">${key('#5FB3A1', 'cache read')}${key('#D97757', 'cache write')}${key('#5FB3A1', 'subagent turn', ';opacity:.45')}${key('#E0A458', 'avoidable burst', ';border-radius:50%')}${key('#A39E93', 'burst', ';border-radius:50%')}<span class="clay">┆ account switch · cost (actual, else est.)</span><span>height = context · peak ${kt(max)}</span></div>
    <svg viewBox="0 0 790 ${H}" width="100%" role="img" aria-label="Timeline of ${T.length} turns across ${lanes.length} account${lanes.length === 1 ? '' : 's'}; now on ${esc(now)}">${lanesSvg}${bars}${marks}
      <text x="${x0}" y="${H - 4}" font-family="IBM Plex Mono" font-size="10" fill="#A39E93">turn ${T[0].i}</text><text x="${x0 + W}" y="${H - 4}" text-anchor="end" font-family="IBM Plex Mono" font-size="10" fill="#A39E93">turn ${T.at(-1).i}</text></svg>`;
};
const adviceCard = (s) => { const a = s.advice, b = a.breakdown ?? {}, k = esc(s.session_key);
  const line = (l, v) => `<div class="between mono"><span class="nm">${l}</span><span>${tok(v)}</span></div>`;
  return `<div class="inset" style="margin:2px 0 8px;border-color:${a.level === 'urgent' ? '#5A3328' : '#4A3A2E'}">
    <div class="between"><b>Context at ${pct(a.pct)} of ${tok(a.window)} — ${a.level === 'urgent' ? 'auto-compact is close' : 'before compact'}</b><span class="chip ${a.level === 'urgent' ? 'bad' : 'warn'}">${esc(a.level)} · ${ago(a.ts)}</span></div>
    <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div class="col small"><span class="muted">Largest tool results in context</span>${(b.top_results ?? []).map((r) => line(`${esc(r.tool)}${r.target !== r.tool ? ` <span class="muted">${esc(r.target)}</span>` : ''}${r.count > 1 ? ` ×${r.count}` : ''}`, r.tokens)).join('') || '<span class="muted">none</span>'}</div>
      <div class="col small"><span class="muted">Files read repeatedly</span>${(b.files_read_repeatedly ?? []).map((r) => line(`${esc(r.target)} ×${r.count}`, r.tokens)).join('') || '<span class="muted">none</span>'}
        <span class="muted" style="margin-top:6px">thinking ${tok(b.thinking_tokens_total)} · ${b.turns ?? '—'} turns · ${b.subagent_turns ?? 0} subagent turns</span></div>
    </div>
    ${a.text ? `<div class="note" style="white-space:pre-wrap;color:var(--fg)">${esc(a.text)}</div>` : '<div class="note">No recommendation text (the advisor call failed or <span class="mono">claude</span> was not found) — the breakdown above is exact.</div>'}
    <div class="row"><button class="sm" data-handoff="${k}" ${ui.busy[s.session_key] ? 'disabled' : ''}>${ui.busy[s.session_key] ? 'Writing handoff…' : s.handoff ? 'Rewrite handoff summary' : 'Write handoff summary'}</button>
      ${s.handoff ? `<button class="sm" data-copy="${k}">Copy</button><span class="small muted">${ago(s.handoff.ts)}</span>` : ''}</div>
    ${s.handoff ? `<pre data-ho="${k}">${esc(s.handoff.text)}</pre>` : ''}</div>`; };
const uColor = (u) => u == null ? 'var(--gray)' : u >= (S.warn_pct ?? .8) ? 'var(--clay)' : u >= .5 ? 'var(--amber)' : 'var(--teal)';
const badge = (st) => `<span class="chip ${st === 'ok' || st === 'unknown' ? 'ok' : st === 'cooling' ? 'warn' : st === 'needs_login' ? 'bad' : ''}">${st === 'ok' || st === 'unknown' ? 'healthy' : esc(st)}</span>`;
const ring = (u, c) => { const L = 150.8, f = Math.min(1, u ?? 0) * L;
  return `<svg width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="5-hour window ${u == null ? 'unknown' : Math.round(u * 100) + '%'}"><circle cx="28" cy="28" r="24" fill="none" stroke="#2C2925" stroke-width="6"/><circle cx="28" cy="28" r="24" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${f.toFixed(1)} ${L}" transform="rotate(-90 28 28)"/><text x="28" y="32" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#F3EFE7">${u == null ? '—' : Math.round(u * 100) + '%'}</text></svg>`; };
const bar = (parts) => `<div class="bar">${parts.map(([w, c]) => `<div style="width:${Math.max(0, Math.min(100, w * 100)).toFixed(1)}%;background:${c}"></div>`).join('')}</div>`;
const kpi = (label, value, sub, cls = '') => `<div class="panel kpi"><div class="label">${label}</div><div class="big ${cls}">${value}</div><div class="small muted">${sub}</div></div>`;
const head = (title, sub, right = '') => `<header class="top"><div class="col"><h1>${title}</h1><div class="muted">${sub}</div></div>${right}</header>`;
const acctLine = (a) => a.kind === 'home' ? 'desktop login · never stored'
  : `oauth · ${a.token_expires_at ? `token refreshes in ${dur((a.token_expires_at - Date.now()) / 1000)}` : 'token not loaded yet'}`;

// ---------- views: each returns [paths to fetch, render(data)] ----------
const views = {
  overview: [['overview', 'sessions', 'settings'], (o, sessions) => {
    const m = byKey(sessions), accts = o.accounts, paused = S.policy === 'manual';
    const src = o.sources ?? {}, srcLine = Object.keys(src).length ? `${src.desktop ?? 0} desktop · ${src.cli ?? 0} terminal sessions` : 'no user-agent data yet';
    const sw = o.switches, write = o.live.find((r) => r.cache === 'write');
    return head('Today', `${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })} · ${accts.length} accounts · ${o.live_sessions} live sessions`,
      `<div class="row"><button data-act="pause-routing" aria-pressed="${paused}" title="Manual policy: new sessions stay on home">${paused ? 'Resume routing' : 'Pause routing'}</button>
       <button class="primary" data-act="goto-add">Add account</button></div>`)
    + `<section class="grid4">
      ${kpi('Requests', o.requests_today, srcLine)}
      ${kpi('Cache hit rate', pct(o.cache_hit_rate), `${tok(o.per_turn.cache_read_avg)} read · ${tok(o.per_turn.cache_create_avg)} written per turn`, 'teal')}
      ${kpi('Switches', sw.manual + sw.forced + sw.ratelimited, `${sw.manual} manual · ${sw.forced} forced · ${sw.ratelimited} rate-limited`)}
      ${kpi('Headroom (5h)', pct(o.headroom_5h_pct), `of one account, pooled · resets ${dur(o.reset_in_s)}`)}
    </section>
    <section class="grid2">
      <div class="panel">
        <div class="between"><h2>Accounts</h2><a href="#accounts" class="small muted">Manage →</a></div>
        ${accts.map((a) => `<div class="inset" style="flex-direction:row;align-items:center;gap:16px;padding:14px">
          ${ring(a.util_5h, uColor(Math.max(a.util_5h ?? 0, a.util_7d ?? 0)))}
          <div class="col" style="flex-grow:1"><div class="row"><b>${esc(a.id)}</b>${badge(a.status)}<span class="small muted">${a.kind === 'home' ? 'desktop login' : esc(acctLine(a))}</span></div>
            <div class="small muted">5h ${pct(a.util_5h)} · ${(a.util_7d ?? 0) > (a.util_5h ?? 0) && (a.util_7d ?? 0) >= .5 ? `<span class="amber">7d ${pct(a.util_7d)} — weekly window is the constraint</span>` : `7d ${pct(a.util_7d)}`}
              · ${a.pinned_sessions} pinned · reset in ${until(a.reset_5h)}</div></div>
          <div class="mono small muted">${a.requests_today} req</div></div>`).join('')}
        <div class="inset warnbox" style="margin-top:auto">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2" style="flex-shrink:0;margin-top:2px" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <div class="col"><b>Router policy: ${esc(o.policy_line.split(' — ')[0])}</b><div class="note">${esc(o.policy_line.split(' — ')[1] ?? '')}. Live sessions stay pinned — a switch re-writes their whole cache.</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="between"><h2>Live</h2><span class="small muted row"><span class="dot" style="width:6px;height:6px"></span>polling 3s</span></div>
        <div class="table live">
          <div class="tr th"><span>time</span><span>account</span><span>session · model</span><span>cache</span><span>latency</span></div>

        `Each later turn re-reads all of it. ${n.big_context_sessions.map((b) => `${b.session_key.slice(0, 8)} peaked at ${tok(b.max_context_est)} (${b.turns_over_120k} turns over 120k)`).map(esc).join('; ')}. Starting fresh with a summary around 100k keeps the same work cheaper.`, '']] : []),
      ...(n.burst_hours.length ? [[`Cache bursts cluster at ${two(n.burst_hours[0].hour)}:00–${two((n.burst_hours[0].hour + 1) % 24)}:00`, 'habit',
        `${n.burst_hours[0].count} of ${n.totals.bursts} bursts this week started in that hour. Sessions left idle over 1h come back cold; one cheap turn before 60 minutes keeps the 1h cache alive.`, '']] : []),
    ];
    const rules = S.context_rules ?? [];
    return head('Insights', 'Patterns across every session, and the context rules that come out of them.',
      `<span class="small muted">Learned from ${n.window.days} days · ${n.window.turns.toLocaleString()} turns · ${n.window.sessions} sessions</span>`)
    + `<section class="grid2" style="grid-template-columns:1.2fr 1fr">
      <div class="panel"><h2>Recurring patterns</h2>
        ${cards.map(([t, chip, body, foot]) => `<div class="inset"><div class="between"><b>${esc(t)}</b><span class="chip ${chip === 'habit' ? '' : 'warn'}">${chip}</span></div><div class="note">${body.startsWith('<') ? body : esc(body)}</div>${foot ? `<div class="small mono amber">${foot}</div>` : ''}</div>`).join('')
          || '<div class="note">No recurring patterns yet. They show up once the ledger has a few days of joined sessions.</div>'}
      </div>
      <div class="col" style="gap:16px">
        <div class="panel"><div class="between"><h2>Context health</h2><span class="small muted">sessions past ${pct(S.context_warn_pct)} of their window</span></div>
          ${adv.map((a) => { const top = a.breakdown?.top_results?.[0];
            return `<div class="inset"><div class="between"><b class="nm">${esc(a.title ?? a.session_key.slice(0, 8))}</b><span class="chip ${a.level === 'urgent' ? 'bad' : 'warn'}">${esc(a.level)} · ${pct(a.pct)}</span></div>
              <div class="note">${a.text ? esc(a.text.length > 280 ? a.text.slice(0, 280) + '…' : a.text) : top ? `Largest tool result: ${esc(top.tool)} ${esc(top.target)} (${tok(top.tokens)}).` : 'Breakdown only.'}</div>
              <div class="small muted">${ago(a.ts)} · <a href="#accounts">full breakdown in Sessions →</a></div></div>`; }).join('') || '<div class="note">No session has crossed the warning threshold yet.</div>'}
        </div>
        <div class="panel">
          <div class="between"><h2>Global context rules</h2><span class="small muted row"><span class="dot" style="background:${S.openvikings_endpoint ? 'var(--teal)' : 'var(--gray)'}"></span>${S.openvikings_endpoint ? 'OpenVikings endpoint set' : 'OpenVikings not connected'}</span></div>
          <div class="note">Rules are stored locally. Syncing them to OpenVikings, so every harness applies them, is a placeholder until that endpoint exists.</div>
          ${rules.map((r) => `<label class="inset" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" data-rule="${esc(r.id)}" ${r.enabled ? 'checked' : ''}><span style="flex-grow:1">${esc(r.text)}</span><span class="chip ${r.state === 'synced' ? 'ok' : ''}">${esc(r.state)}</span></label>`).join('')}
          <form id="rule-add" class="row"><label class="sr" for="rule-text">New rule</label><input id="rule-text" name="text" placeholder="New rule…" required style="flex-grow:1"><button class="sm">Add</button></form>
          <form id="ov" class="row" style="flex-wrap:wrap"><label class="row small muted" style="flex-grow:1">Endpoint<input name="endpoint" value="${esc(S.openvikings_endpoint ?? '')}" placeholder="not set" style="flex-grow:1"></label><button class="sm">Save</button>
            <button type="button" class="sm" disabled title="Placeholder: sync is not built yet">Sync now</button></form>
        </div>
        <div class="panel"><h2>This week, if you took every suggestion</h2>
          <div class="grid4" style="grid-template-columns:repeat(3,minmax(0,1fr))">
            <div class="col"><span class="small muted">tokens saved</span><span class="mono" style="font-size:24px">${n.totals.tokens_saved_est ? '≈' + tok(n.totals.tokens_saved_est) : NA}</span></div>
            <div class="col"><span class="small muted">of one weekly window</span><span class="mono" style="font-size:24px">${NA}</span></div>
            <div class="col"><span class="small muted">bursts avoided</span><span class="mono" style="font-size:24px">${n.totals.bursts_avoidable}</span></div>
          </div>
          <div class="note">Counted from avoidable cache bursts in your own transcripts, joined to the router's ledger by request id. They change as the ledger grows.</div>
        </div>
      </div></section>`;
  }],
};

// ---------- routing, polling, rendering ----------
const route = () => { const r = location.hash.slice(1).split('?')[0]; return views[r] ? r : 'overview'; };
let seq = 0;
async function refresh(force) {
  const r = route(), [paths, render] = views[r], my = ++seq;
  document.querySelectorAll('.rail a').forEach((a) => a.toggleAttribute('aria-current', a.getAttribute('href') === `#${r}`));
  try {
    const [h, ...data] = await Promise.all(['health', ...paths.map((p) => (typeof p === 'function' ? p() : p))].map(get));
    if (my !== seq) return; // a newer refresh (route change) superseded this one
    if (data.at(-1)?.policy) S = data.at(-1); else if (data[0]?.settings) S = data[0].settings;
    $('#status').innerHTML = `<div class="row"><span class="dot" style="background:${h.transparent ? 'var(--teal)' : 'var(--amber)'}"></span><span style="color:var(--fg)">Transparent mode ${h.transparent ? 'on' : 'off'}</span></div>
      <div>${h.launchd ? 'launchd' : 'manual run'} · up ${dur(h.uptime)}</div><div class="mono">${h.transparent ? 'api.anthropic.com → 127.0.0.1' : 'explicit :4001 only'}</div>
      <div>${h.requests.toLocaleString()} requests · ${h.sessions} sessions</div>`;
    // never yank a control out from under the user; the next tick catches up
    const f = document.activeElement;
    if (!force && f && $('#main').contains(f) && /^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)) return;
    $('#main').innerHTML = render(...data);
    document.title = `agent-router`;
  } catch (e) {
    $('#status').innerHTML = `<span class="err">router unreachable: ${esc(e.message)}</span>`;
  }
}
async function act(path, body, method = 'POST') {
  const r = await send(method, path, body);
  if (r?.error || r?.ok === false) alert(JSON.stringify(r.error ?? r));
  await refresh(true);
  return r;
}
const putSettings = (patch) => act('settings', patch, 'PUT');

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a[data-session]');
  if (!t) return;
  const d = t.dataset;
  if (d.session) { ui.cacheSession = d.session; return; } // then the #cache link navigates
  if (d.a) { const [id, action] = d.a.split('/'); if (action !== 'remove' || confirm(`Remove ${id}? Its sessions fall back to another account.`)) act(`accounts/${encodeURIComponent(id)}/${action}`); }
  if (d.tl) { ui.tl = ui.tl === d.tl ? null : d.tl; refresh(true); }
  if (d.handoff) {
    ui.busy[d.handoff] = true; refresh(true);
    send('POST', `sessions/${encodeURIComponent(d.handoff)}/handoff`).then((r) => { if (r?.error) alert(`Handoff failed: ${r.error.type}`); }).finally(() => { delete ui.busy[d.handoff]; refresh(true); });
  }
  if (d.copy) navigator.clipboard.writeText(document.querySelector(`pre[data-ho="${CSS.escape(d.copy)}"]`).textContent).then(() => { t.textContent = 'Copied'; });
  if (d.pin) {
    const acct = document.querySelector(`select[data-s="${CSS.escape(d.pin)}"]`).value;
    const cost = d.actual ? ` — last switch cost ${kt(Number(d.actual))} tokens` : d.cost ? `: ≈${Number(d.cost).toLocaleString()} tokens` : '';
    if (confirm(`Route session ${d.pin.slice(0, 8)} to ${acct}?\nIts next turn re-writes the whole cache on ${acct}${cost}.`))
      act(`sessions/${encodeURIComponent(d.pin)}/pin`, { account_id: acct }).then(() => delete ui.open[`pin-${d.pin}`]);
  }
  if (d.act === 'pause-routing') putSettings({ policy: S.policy === 'manual' ? 'sticky_least_utilized' : 'manual' });
  if (d.act === 'focus-add') $('#add-id')?.focus();
  if (d.act === 'goto-add') { location.hash = '#accounts'; setTimeout(() => $('#add-id')?.focus(), 400); }
  if (d.act === 'relogin') { ui.open[`relogin-${d.id}`] = !ui.open[`relogin-${d.id}`]; refresh(true); }
  if (d.act === 'units') { ui.dollars = d.v === '1'; refresh(true); }
  if (d.act === 'rate-del') { const rc = { ...S.rate_card }; delete rc[d.m]; putSettings({ rate_card: rc }); }
  if (d.act === 'rate-add') {
    const f = new FormData($('#budgets')), m = String(f.get('rc_model')).trim();
    if (!m) return alert('Model prefix is required');
    putSettings({ rate_card: { ...S.rate_card, [m]: Object.fromEntries(['input', 'output', 'cache_read', 'cache_write'].map((k) => [k, Number(f.get(`rc_${k}`)) || 0])) } });
  }
});
document.addEventListener('change', (e) => {
  const t = e.target, d = t.dataset;
  if (d.s) ui.open[`pin-${d.s}`] = t.value;
  if (d.act === 'cache-session') { ui.cacheSession = t.value; refresh(true); }
  if (d.act === 'cache-days') { ui.cacheDays = Number(t.value); refresh(true); }
  if (t.name === 'policy') putSettings({ policy: t.value });
  if (t.closest('#budgets') && /_pct$/.test(t.name)) {
    const v = Number(t.value);
    if (v >= 0 && v <= 100) putSettings({ [t.name]: v / 100 }); else alert('Enter 0–100');
  }
  if (d.rule) putSettings({ context_rules: S.context_rules.map((r) => (r.id === d.rule ? { ...r, enabled: t.checked } : r)) });
});
document.addEventListener('toggle', (e) => { if (e.target.dataset?.k) ui.open[e.target.dataset.k] = e.target.open; }, true);
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === 'add') {
    const id = String(f.get('id')).trim(), r = await act('accounts', { id });
    if (r.login_cmd) { ui.added = { id, login_cmd: r.login_cmd }; refresh(true); }
  }
  if (e.target.id === 'rule-add') putSettings({ context_rules: [...S.context_rules, { id: `r${Date.now()}`, text: String(f.get('text')), enabled: true, state: 'proposed' }] });
  if (e.target.id === 'ov') putSettings({ openvikings_endpoint: String(f.get('endpoint')).trim() || null });
});
addEventListener('hashchange', () => refresh(true));
refresh(true);
setInterval(refresh, 3000);
</script>
</body>
</html>
